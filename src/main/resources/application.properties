spring.application.name=OllamaAIPractice
server.port=8080

#OLLAMA MODEL CONFIG
#spring.ai.ollama.base-url=http://localhost:11434
##spring.ai.ollama.chat.model=phi3
#spring.ai.ollama.chat.model=minimax-m2:cloud
#spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.ollama.embedding.enabled=false

spring.ai.huggingface.chat.api-key=${HUGGINGFACE_API_KEY}
spring.ai.huggingface.chat.enabled=false
huggingface.api-key=${spring.ai.huggingface.chat.api-key}
spring.ai.openai.chat.enabled=true
spring.ai.openai.base-url=https://router.huggingface.co
spring.ai.openai.api-key=${spring.ai.huggingface.chat.api-key}
spring.ai.openai.chat.options.model=openai/gpt-oss-120b:fastest
spring.ai.openai.embedding.enabled=false
spring.ai.openai.audio.transcription.enabled=false
spring.ai.openai.audio.speech.enabled=false
spring.ai.openai.image.enabled=false
#HUGGINGFACE MODEL CONFIG



spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
server.address=0.0.0.0

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.main.allow-bean-definition-overriding=true

spring.sql.init.schema-locations=classpath:init/schema.sql
spring.sql.init.mode=always

spring.servlet.multipart.max-file-size=20MB

# Use locally downloaded ONNX models to avoid Docker network issues
spring.ai.embedding.transformer.onnx.model-uri=classpath:/onnx/all-MiniLM-L6-v2/model.onnx
spring.ai.embedding.transformer.tokenizer.uri=classpath:/onnx/all-MiniLM-L6-v2/tokenizer.json
spring.ai.vectorstore.pgvector.dimensions=384

# Prevent OpenAI Autoconfiguration from crashing without an API key
#spring.ai.openai.api-key=${OPENAI_API_KEY}

# Enable the health endpoint
management.endpoints.web.exposure.include=health

# Allow health checks to report application availability
management.endpoint.health.probes.enabled=true

# Use the main application port for health checks
management.server.port=8080