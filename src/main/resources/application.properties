spring.application.name=GenAIService
server.port=8080
server.address=0.0.0.0

# ==============================================================================
# GOOGLE GEMINI CONFIGURATION
# ==============================================================================
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# Gemini Chat Model
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.chat.options.temperature=0.7

# Gemini Text Embedding Model (768 dimensions for text-embedding-004)
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.options.model=text-embedding-004
spring.ai.google.genai.embedding.text.options.dimensions=768

# ==============================================================================
# DATASOURCE & JPA
# ==============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:demo_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.main.allow-bean-definition-overriding=true

# Database Initialization
spring.sql.init.schema-locations=classpath:init/schema.sql
spring.sql.init.mode=always

# Multipart File Upload
spring.servlet.multipart.max-file-size=20MB

# Vector Store (Gemini embedding dimension: 768)
spring.ai.vectorstore.pgvector.dimensions=768

# ==============================================================================
# ACTUATOR & MONITORING
# ==============================================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.server.port=8080
